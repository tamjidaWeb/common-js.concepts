<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="secret-info">My secret info</h1>
    <input type="text" id="input-delete" placeholder="Enter secret info">
    <button disabled id="btn-delete" >Submit</button>

    <script>
       document.getElementById('input-delete').addEventListener('keyup',function(event){
       const text = event.target.value;
        console.log('user is typing...',text);
        const btnDelete = document.getElementById('btn-delete');
        if(text==='delete'){
            console.log('delete');
            btnDelete.removeAttribute('disabled');
            const secretInfo = document.getElementById('secret-info');
            secretInfo.style.display= 'none';
        }
        else{
            console.log('something else');
            btnDelete.setAttribute('disabled',true);
        }
       })
    </script>
</body>
</html>
