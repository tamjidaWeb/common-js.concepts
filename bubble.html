<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            border: 2px solid salmon;
            margin: 4px;
        }
        ul{
            border: 2px solid purple;
            margin: 4px;
        }
        section{
            border: 1px solid green;
            margin: 4px;
        }
       li{
            border: 2px solid blue;
            margin: 4px;
        }
    </style>
</head>
<body>
    <h1>Explore Event Bubble</h1>

    <section>
        <h3>List of things</h3>
        <ol id="item-list">
            <li id="item-1">Lorem, ipsum.</li>
            <li id="item-2">Ab, laboriosam.</li>
            <li id="item-3">Labore, excepturi!</li>
            <li id="item-4">Doloremque, itaque.</li>
            <li id="item-5">Nobis, ex?</li>
            <li id="item-6">Minima, molestias?</li>
        </ol>
    </section>


    <script>
        //list item 2 click handler
        document.getElementById('item-2').addEventListener('click',function(event){
            console.log('item 2 clicked');
            event.stopPropagation();
        })
        //ol click handler
        document.getElementById('item-list').addEventListener('click',function(){
            console.log('ol clicked')
        })
    </script>
</body>
</html>
